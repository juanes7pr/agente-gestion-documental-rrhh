<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión Documental Inteligente de RR. HH.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1020;--c1:#111A2E;--c2:#1C293D;--b:#2563EB;--bl:#3B82F6;--t:#F8FAFC;--m:#94A3B8;--o:#F59E0B;--g:#22C55E;--r:#EF4444;--y:#EAB308;--line:rgba(148,163,184,.14);--card:rgba(17,26,46,.78);--fh:'Space Grotesk',system-ui,sans-serif;--fb:'Plus Jakarta Sans',system-ui,sans-serif;--nav:52px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:var(--fb)}
body{background:radial-gradient(ellipse at 15% 0,#101a3a 0,#0B1020 55%)}
#bg{position:fixed;inset:0;z-index:0}
.glow{position:fixed;width:36vw;height:36vw;border-radius:50%;filter:blur(130px);background:rgba(37,99,235,.12);z-index:0;pointer-events:none}
.g1{top:-16vw;left:-12vw}.g2{bottom:-20vw;right:-10vw}
#stage{position:fixed;inset:0 0 var(--nav);z-index:1}
.slide{position:absolute;inset:0;padding:clamp(1rem,4vh,3rem) clamp(1.2rem,6vw,6rem);overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;gap:clamp(.7rem,2.2vh,1.5rem);opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .45s,transform .45s,visibility .45s}
.slide>:first-child{margin-top:auto}.slide>:last-child{margin-bottom:auto}
.slide.on{opacity:1;visibility:visible;transform:none}.slide.prev{transform:translateX(-28px)}
.k{color:var(--bl);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
h1,h2,h3,.big,.big9,.num,.node b{font-family:var(--fh)}
h1{font-size:clamp(2.3rem,min(5vw,8vh),4.4rem);line-height:1.04;font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.55rem,min(2.8vw,5vh),2.5rem);line-height:1.12;font-weight:700;letter-spacing:-.01em;max-width:30ch}
h3{font-size:clamp(1rem,1.3vw,1.15rem);font-weight:600;margin-bottom:.45rem}
p,li{color:#cbd5e1;line-height:1.55;font-size:clamp(.92rem,min(1.2vw,2.3vh),1.1rem);overflow-wrap:break-word}.m{color:var(--m);font-size:.82rem}
.sub{color:var(--m);font-size:clamp(1rem,1.5vw,1.25rem);max-width:48ch;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(.9rem,2.2vh,1.4rem) clamp(1rem,1.6vw,1.5rem);min-width:0}
.on .card,.on .node,.on .lc{animation:rise .55s both}.on .card:nth-child(2),.on .lc:nth-child(2){animation-delay:.1s}.on .card:nth-child(3),.on .lc:nth-child(3){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.grid,.grid3{display:grid;gap:clamp(.8rem,2vh,1.3rem);grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
ul,ol{list-style:none;padding:0}li{display:grid;grid-template-columns:1.6rem 1fr;gap:.5rem;margin:.3rem 0}
.ic{color:var(--g);font-weight:700;text-align:center}.n{color:var(--bl);font-family:var(--fh)}.warn .ic{color:var(--o)}.bad .ic{color:var(--r)}
.ok{border-left:3px solid var(--g)}.warn{border-left:3px solid var(--o)}.bad{border-left:3px solid var(--r)}
.hum{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.4);box-shadow:0 0 36px rgba(245,158,11,.1)}
.rob{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.3)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}.flow i{color:var(--bl);font-style:normal}
.flow span{background:var(--c2);border-radius:10px;padding:.5rem .85rem;font-size:clamp(.85rem,1.1vw,.98rem);overflow-wrap:break-word}
.flow span.hl{background:var(--b);font-weight:600}
.btn{align-self:flex-start;background:var(--b);color:#fff;border:0;border-radius:10px;padding:.85rem 1.5rem;font:600 1rem var(--fb);cursor:pointer;transition:background .2s,transform .2s;box-shadow:0 0 26px rgba(37,99,235,.45)}
.btn:hover{background:var(--bl);transform:translateY(-2px)}
.cover{display:grid;grid-template-columns:1.2fr .8fr;gap:3vw;align-items:center}.cover>div{display:flex;flex-direction:column;gap:clamp(.8rem,2vh,1.4rem)}
.hero svg{width:100%;max-width:400px;opacity:.9}
.pulse{animation:pl 3.5s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
.tag{border-radius:99px;padding:.2rem .75rem;font-size:.72rem;letter-spacing:.08em}.tag.r{background:rgba(239,68,68,.14);color:#fca5a5}
.evo{display:flex;flex-wrap:wrap;gap:.9rem;align-items:stretch}.evo .card{flex:1;min-width:170px;text-align:center}.evo .big{font-size:clamp(2rem,4vw,2.8rem);font-weight:700;line-height:1.1}
.evo .fin{background:var(--b);border-color:var(--bl);box-shadow:0 0 36px rgba(37,99,235,.4)}.evo .fin p{color:#fff}.evo>i{align-self:center;color:var(--bl);font-style:normal;font-size:1.5rem}
.nodes{display:flex;flex-wrap:wrap;gap:.8rem}.node{flex:1;min-width:130px;background:var(--card);color:var(--t);border:1px solid var(--line);border-radius:14px;padding:.9rem;text-align:left;cursor:pointer;font:inherit;font-size:clamp(.82rem,1vw,.92rem);line-height:1.4;transition:transform .2s,border-color .2s;overflow-wrap:break-word}
.node b{display:block;font-size:1.5rem;color:var(--bl);margin-bottom:.3rem}.node:hover,.node.sel{transform:translateY(-3px);border-color:var(--bl);box-shadow:0 0 22px rgba(59,130,246,.3)}
.node.h{border-color:rgba(245,158,11,.55);background:rgba(245,158,11,.08)}.node.h b{color:var(--o)}.node.h.sel,.node.h:hover{border-color:var(--o);box-shadow:0 0 22px rgba(245,158,11,.35)}
#np{min-height:5rem}
.top{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.num{color:var(--bl);font-weight:700;letter-spacing:.14em;font-size:.82rem}
.risk{display:inline-block;padding:.45rem 1rem;border-radius:99px;font-weight:700;font-size:.88rem;white-space:nowrap}
.risk.g{background:rgba(34,197,94,.13);color:var(--g)}.risk.y{background:rgba(234,179,8,.13);color:var(--y)}.risk.r{background:rgba(239,68,68,.13);color:var(--r)}
.row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.msg{font-weight:600;color:var(--t);flex:1;min-width:min(100%,240px)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:.8rem;align-items:center;text-align:center}.vs b{color:var(--r);font-size:1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}.chips span{border:1px dashed var(--o);color:var(--o);border-radius:8px;padding:.3rem .7rem;font-size:.85rem}
.inj{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;color:#fca5a5}
.big9{font-size:clamp(3rem,8vw,5.5rem);font-weight:700;color:var(--bl);line-height:1;text-shadow:0 0 36px rgba(59,130,246,.5)}
.hall{border-left:3px solid var(--o)}.quote{font-size:clamp(1.05rem,min(1.8vw,3.4vh),1.5rem);font-weight:600;max-width:50ch;line-height:1.4;font-family:var(--fh);color:var(--t)}
.meter{display:flex;gap:.4rem;margin-top:.6rem}.meter span{flex:1;padding:.4rem;text-align:center;border-radius:8px;font-size:.85rem;font-weight:600}
.lim{display:grid;grid-template-columns:1fr 1fr;gap:clamp(.6rem,1.6vh,1rem)}
.lc{display:grid;grid-template-columns:2.4rem 1fr;gap:.9rem;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(.7rem,1.8vh,1.1rem) 1.1rem;min-width:0}
.lc .ico{width:2.4rem;height:2.4rem;display:grid;place-items:center;background:rgba(245,158,11,.1);border-radius:10px;font-size:1.1rem}
.lc h3{margin-bottom:.2rem}.lc p{font-size:clamp(.85rem,min(1.05vw,2.1vh),.98rem);line-height:1.45}
.learn{display:flex;flex-wrap:wrap;gap:.5rem .7rem;align-items:center}.learn b{font-family:var(--fh);margin-right:.4rem}.learn span{background:var(--c2);border-radius:8px;padding:.4rem .8rem;font-size:.88rem}
#ctrl{position:fixed;left:0;right:0;bottom:0;height:var(--nav);z-index:5;display:flex;align-items:center;justify-content:center;gap:.7rem;background:#0B1020;border-top:1px solid var(--line)}
#ctrl button{background:transparent;color:var(--t);border:1px solid var(--line);border-radius:8px;padding:.45rem .9rem;font:600 .88rem var(--fb);cursor:pointer;transition:background .2s}
#ctrl button:hover{background:var(--c2)}#ctrl .pri{background:var(--b);border-color:var(--b)}#ctrl .pri:hover{background:var(--bl)}
#count{min-width:5.5rem;text-align:center;font-weight:600;color:var(--m);font-variant-numeric:tabular-nums;font-size:.9rem}
#bar{position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--c2)}#fill{height:100%;width:0;background:var(--bl);transition:width .4s}
@media(max-width:900px){.lim{grid-template-columns:1fr}.cover{grid-template-columns:1fr}.hero{display:none}}
@media(max-width:760px){.vs{grid-template-columns:1fr}.slide{padding:1rem 1.1rem}#ctrl{gap:.4rem}#ctrl button{padding:.45rem .6rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<canvas id="bg"></canvas><div class="glow g1"></div><div class="glow g2"></div>
<main id="stage" aria-live="polite"></main>
<nav id="ctrl" aria-label="Controles de la presentación">
  <div id="bar"><div id="fill"></div></div>
  <button data-go="first" title="Portada (Home)">⌂</button>
  <button data-go="prev">← Anterior</button>
  <span id="count">01 / 20</span>
  <button class="pri" data-go="next">Siguiente →</button>
  <button id="fs" title="Pantalla completa">⛶</button>
</nav>
<script>
(function(){
const H=(k,t)=>`<p class="k">${k}</p><h2>${t}</h2>`;
const L=a=>`<ul>${a.map(x=>`<li><span class="ic">✓</span><span>${x}</span></li>`).join('')}</ul>`;
const N=a=>`<ol>${a.map((x,k)=>`<li><span class="ic n">${k+1}</span><span>${x}</span></li>`).join('')}</ol>`;
const F=(a,c='')=>`<div class="flow ${c}">${a.map(x=>`<span>${x}</span>`).join('<i>→</i>')}</div>`;
const C=(t,b,c='')=>`<div class="card ${c}"><h3>${t}</h3>${b}</div>`;
const nodes=[['Clasificar y extraer información del documento','Recibe el texto, identifica la categoría y extrae los datos expresamente mencionados.'],['Analizar y validar información extraída','Revisa la coherencia interna y busca errores de extracción y contradicciones.'],['Validar integridad documental','Evalúa si el documento contiene los elementos esperados según su categoría.'],['Analizar inconsistencias y riesgos','Consolida los hallazgos y determina el riesgo: bajo, medio o alto, con justificación.'],['Revisión y aprobación humana','Una persona revisa los resultados y elige Approve o Regenerate.'],['Generar resultado final','Consolida los nodos anteriores y la decisión humana en un informe estructurado.'],['Generar trazabilidad documental','Organiza un registro del proceso realizado.']];
const T=o=>`<div class="top"><span class="num">PRUEBA ${o.n} DE 9</span>${o.rob?'<span class="tag r">PRUEBA DE ROBUSTEZ</span>':''}</div><h2>${o.t}</h2>
<div class="grid3">${C('📄 Documento',`<p class="m">Tipo documental</p><p>${o.doc}</p><p class="m" style="margin-top:.5rem">Persona ficticia</p><p>${o.p}</p>`,o.rob?'rob':'')}${C('🎯 Qué debía comprobar',`<p>${o.obj}</p>`,o.rob?'rob':'')}${C('Resultado obtenido',L(o.res),o.rob?'warn':'ok')}</div>
${o.x||''}<div class="row"><span class="risk ${o.rc}">${o.rl||'Riesgo'}: ${o.r}</span><p class="msg">${o.msg}</p></div>${o.f?`<div class="card hall"><p><b>Hallazgo:</b> ${o.f}</p></div>`:''}`;
const nodeBtns=nodes.map((n,k)=>`<button class="node ${k==4?'h':''}" data-t="Nodo ${k+1}: ${n[0]}" data-d="${n[1]}"><b>${k+1}</b>${n[0]}</button>`).join('');
window.SLIDES=[
`<div class="cover"><div><p class="k">Tecnologías Disruptivas · Synergycomm</p><h1>Gestión Documental Inteligente de RR. HH.</h1><p class="sub">Versión Avanzada — Sistema agéntico para el análisis y validación documental.</p><p class="m">Juan Esteban Gutiérrez Parra · Andrés Felipe García Parra</p><button class="btn" data-go="next">Explorar presentación</button></div>
<div class="hero"><svg viewBox="0 0 400 340" fill="none" stroke="#3B82F6" stroke-width="2"><g stroke-opacity=".6"><path d="M200 170L80 80M200 170L320 70M200 170L90 270M200 170L320 270"/></g><rect x="150" y="110" width="100" height="120" rx="12" fill="#111A2E"/><path d="M170 140h60M170 160h60M170 180h40" stroke="#F8FAFC"/><g fill="#111A2E"><rect x="45" y="55" width="70" height="50" rx="8"/><rect x="285" y="45" width="70" height="50" rx="8"/><rect x="55" y="245" width="70" height="50" rx="8"/><rect x="285" y="245" width="70" height="50" rx="8"/></g><g fill="#3B82F6" class="pulse"><circle cx="80" cy="80" r="6"/><circle cx="320" cy="70" r="6"/><circle cx="90" cy="270" r="6"/><circle cx="320" cy="270" r="6"/><circle cx="200" cy="170" r="8"/></g></svg></div></div>`,
H('Introducción y contexto','¿Por qué automatizar el análisis documental de Recursos Humanos?')+`<p class="sub">RR. HH. maneja hojas de vida, certificados laborales, contratos, solicitudes de permisos y evaluaciones de desempeño. Revisarlos manualmente exige tiempo y atención, sobre todo al buscar datos faltantes, contradicciones o inconsistencias.</p><div class="grid">${C('Proceso tradicional',F(['Documento','Revisión manual','Identificación de problemas','Resultado']))}${C('Propuesta inteligente',F(['Documento','Agentes especializados','Validaciones','Revisión humana','Informe final'],'o'),'ok')}</div><p class="m">El sistema no reemplaza a los profesionales de RR. HH.: apoya el análisis documental.</p>`,
H('Evolución de la arquitectura','De 18 nodos a una arquitectura de 7 etapas')+`<div class="evo"><div class="card"><p class="big">18</p><p>NODOS · primera propuesta</p></div><i>→</i><div class="card"><p class="big">4</p><p>NODOS · simplificación recomendada por un ingeniero de Synergy</p></div><i>→</i><div class="card fin"><p class="big">7</p><p>NODOS · arquitectura final, construida desde cero</p></div></div>${L(['Se separaron mejor las responsabilidades: clasificación, validación, integridad, riesgos, aprobación, informe y trazabilidad.','Las limitaciones al ampliar el primer flujo obligaron a crear uno nuevo.','Fue una decisión de diseño durante el desarrollo, no una optimización automática de la plataforma.'])}`,
H('Skill y configuración general','El conocimiento especializado del agente')+`<div class="grid">${C('Skill: Analista de Documentos de Recursos Humanos','<p>Conocimiento compartido por los agentes especializados.</p>'+L(['Clasificar documentos','Extraer únicamente información explícita','Identificar datos faltantes','Detectar ambigüedades y contradicciones','Evaluar fechas con precaución','Evitar inventar información','Generar análisis estructurados']))}${C('Categorías documentales contempladas',N(['Hoja de vida','Certificado laboral','Contrato laboral','Solicitud de permiso o licencia','Evaluación de desempeño','Otros documentos','Tipo no identificado']))}</div><p class="m">Los agentes utilizan Gemini 3.5 Flash-Lite en la configuración implementada.</p>`,
H('Arquitectura completa','Así funciona nuestro flujo de siete nodos')+`<div class="nodes">${nodeBtns}</div>${C('Selecciona un nodo','<p>Toca cualquier tarjeta para ver su función. El nodo 5, en naranja, es la intervención humana.</p>').replace('class="card','id="np" class="card')}`,
H('Primera etapa','Comprender y validar el documento')+`<div class="grid">${C('Nodo 1 · Clasificar y extraer información','<p>Recibe el texto del documento, identifica su categoría y extrae los datos expresamente mencionados. Señala información faltante, ambigüedades y posibles contradicciones.</p>')}${C('Nodo 2 · Analizar y validar información extraída','<p>Revisa la información del nodo anterior y evalúa su coherencia interna. Busca errores de extracción, contradicciones e interpretaciones incorrectas.</p>')}</div>${F(['Documento de entrada','Nodo 1','Nodo 2','Información estructurada y validada'])}<p class="quote">Primero identificamos qué contiene el documento; después comprobamos si la información extraída es coherente.</p>`,
H('Segunda etapa','Integridad documental y evaluación de riesgos')+`<div class="grid">${C('Nodo 3 · Validar integridad documental','<p>Evalúa si el documento contiene los elementos esperados según su categoría.</p>'+L(['Completa','Parcialmente completa','Insuficiente','No evaluable']))}${C('Nodo 4 · Analizar inconsistencias y riesgos','<p>Consolida los hallazgos, justifica el riesgo y señala qué requiere atención.</p><div class="meter"><span style="background:rgba(34,197,94,.2);color:var(--g)">Bajo</span><span style="background:rgba(234,179,8,.2);color:var(--y)">Medio</span><span style="background:rgba(239,68,68,.2);color:var(--r)">Alto</span></div>')}</div>${F(['Integridad documental','Evaluación de inconsistencias y riesgos'])}<p class="quote">No basta con extraer información: también debemos determinar si el documento está suficientemente completo y si presenta situaciones que requieren revisión.</p>`,
H('Nodo 5 · Revisión y aprobación humana','El criterio humano sigue siendo fundamental')+`<div class="grid">${C('👤 La persona encargada puede revisar',L(['Información extraída','Validación de coherencia','Integridad documental','Inconsistencias detectadas','Nivel de riesgo']),'hum')}${C('Opciones de la interfaz','<p><b style="color:var(--g)">Approve:</b> permite continuar el procesamiento dentro del flujo.</p><p style="margin-top:.6rem"><b style="color:var(--o)">Regenerate:</b> solicita regenerar o revisar el resultado según la configuración del paso.</p><p class="m" style="margin-top:.6rem">Regenerate no equivale a Reject: no es un rechazo definitivo.</p>','hum')}</div><p class="quote" style="color:var(--o)">La inteligencia artificial analiza; la persona revisa y decide si autoriza continuar el procesamiento.</p>`,
H('Tercera etapa','Resultado final y trazabilidad')+`<div class="grid">${C('📄 Nodo 6 · Generar resultado final','<p>Consolida los nodos anteriores y la decisión humana en un informe con:</p>'+L(['Identificación del documento','Información extraída','Validaciones e integridad','Inconsistencias y riesgos','Recomendaciones']))}${C('🗂 Nodo 7 · Generar trazabilidad','<p>Organiza un registro del proceso con:</p>'+L(['Identificación del documento','Resumen de etapas ejecutadas','Nivel de riesgo','Decisión humana recibida','Estado del procesamiento','Observaciones y limitaciones']))}</div>${F(['Informe final','Nodo 7','Registro de trazabilidad'])}<p class="quote">El proceso termina con un resultado organizado y un registro de lo ocurrido durante el análisis.</p>`,
T({n:1,t:'Certificado laboral',doc:'Certificado laboral',p:'Valentina Andrea Rojas Martínez',obj:'Identificar un certificado laboral, extraer su información y evaluar la coherencia e integridad del documento.',res:['Clasificación correcta','Extracción de información adecuada','Sin afirmaciones de verificación externa','Integridad documental completa'],r:'Bajo',rc:'g',msg:'El flujo analizó correctamente un certificado laboral sin afirmar que había verificado externamente la información.'}),
T({n:2,t:'Hoja de vida',doc:'Hoja de vida',p:'Laura Camila Rodríguez Pérez',obj:'Identificar una hoja de vida y organizar la información personal y profesional presentada.',res:['Clasificación correcta','Extracción de información','Análisis de cronología','Integridad completa'],r:'Bajo',rc:'g',msg:'El sistema organizó la información de la hoja de vida y revisó la coherencia de su cronología.'}),
T({n:3,t:'Solicitud de permiso laboral',doc:'Solicitud de permiso laboral',p:'Daniela Alejandra Martínez Torres',obj:'Identificar el motivo de la solicitud y las fechas correspondientes.',res:['Identificación del tipo documental','Extracción del motivo y periodo solicitado','Integridad documental completa'],r:'Bajo',rc:'g',f:'No confundió la ausencia de aprobación con un documento incompleto: una solicitud puede estar bien elaborada y seguir pendiente de aprobación.',msg:'El sistema diferencia entre la integridad de un documento y el estado administrativo de una solicitud.'}),
T({n:4,t:'Contrato laboral',doc:'Contrato laboral',p:'Natalia Andrea Hernández Castro',obj:'Extraer las partes involucradas, condiciones y fechas del contrato.',res:['Identificación correcta del contrato','Extracción de información contractual','Revisión de fechas','Integridad completa'],r:'Bajo',rc:'g',f:'No asumió que el contrato seguía vigente solo por ser de duración indefinida o no tener fecha de finalización.',msg:'El flujo analiza información contractual sin convertir datos declarados en hechos verificados externamente.'}),
T({n:5,t:'Evaluación de desempeño',doc:'Evaluación de desempeño',p:'Sebastián Andrés Morales Castillo',obj:'Extraer calificaciones e interpretar los resultados de la evaluación.',res:['Extracción de las calificaciones','Cálculo correcto del promedio: 4,5/5','Identificación de aspectos por mejorar','Integridad completa'],r:'Bajo',rc:'g',msg:'El flujo interpretó la información evaluativa y distinguió las calificaciones de las oportunidades de mejora.'}),
T({n:6,t:'Constancia de entrega de equipos',doc:'Constancia de entrega de equipos tecnológicos',p:'Andrés Felipe Torres Mendoza',obj:'Identificar un documento ajeno a las categorías principales y analizar su contenido.',res:['Clasificación dentro de «Otros»','Extracción de los equipos tecnológicos','Identificación de números de serie','Integridad completa'],r:'Bajo',rc:'g',f:'Organizó la información de los equipos, pero no afirmó haber verificado físicamente su entrega.',msg:'El sistema analiza documentos fuera de las categorías principales sin forzar una clasificación incorrecta.'}),

<script>
(function(){
const c=document.getElementById('bg'),x=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,P=[];
function size(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(55,Math.round(W*H/26000))},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.3,a:Math.random()*6.28}))}
function draw(){x.clearRect(0,0,W,H);
for(const p of P){if(!reduce){p.x+=Math.cos(p.a)*.12*p.z;p.y+=Math.sin(p.a)*.12*p.z;p.a+=(Math.random()-.5)*.02;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0}
x.fillStyle=(p.z>.8?'rgba(248,250,252,':'rgba(59,130,246,')+(.1+p.z*.22)+')';x.beginPath();x.arc(p.x,p.y,p.z*1.7,0,6.28);x.fill()}
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<120){x.strokeStyle='rgba(59,130,246,'+(.06*(1-d/120))+')';x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
if(!reduce)requestAnimationFrame(draw)}
addEventListener('resize',()=>{size();if(reduce)draw()});size();draw();
})();

</script>
<script>
(function(){
const stage=document.getElementById('stage'),count=document.getElementById('count'),fill=document.getElementById('fill');
window.SLIDES.forEach(h=>{const s=document.createElement('section');s.className='slide';s.innerHTML=h;stage.appendChild(s)});
const els=[...stage.children],N=els.length;let i=0;
function go(n){i=Math.max(0,Math.min(N-1,n));els.forEach((e,k)=>{e.classList.toggle('on',k===i);e.classList.toggle('prev',k<i)});els[i].scrollTop=0;
count.textContent=String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');fill.style.width=((i+1)/N*100)+'%';history.replaceState(null,'','#'+(i+1))}
document.addEventListener('click',e=>{
const g=e.target.closest('[data-go]');if(g){const v=g.dataset.go;go(v==='next'?i+1:v==='prev'?i-1:v==='first'?0:+v)}
const n=e.target.closest('.node[data-d]');if(n){document.querySelectorAll('.node').forEach(x=>x.classList.toggle('sel',x===n));document.getElementById('np').innerHTML='<h3>'+n.dataset.t+'</h3><p>'+n.dataset.d+'</p>'}});
document.addEventListener('keydown',e=>{const k=e.key;
if(k==='ArrowRight'||k===' '){e.preventDefault();go(i+1)}else if(k==='ArrowLeft')go(i-1);else if(k==='Home')go(0);else if(k==='End')go(N-1)});
document.getElementById('fs').addEventListener('click',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()});
go((parseInt(location.hash.slice(1))||1)-1);
})();

</script>
